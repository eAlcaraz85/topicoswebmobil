worker_processes 1;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream pedidos {
        server pedidos:8001;
    }

    upstream recomendar {
        server recomendar:8002;
    }

    server {
        listen 80;

        # Front HTML (punto de vista completo del cliente)
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location /pedidos {
            proxy_pass http://pedidos;
            proxy_set_header Host $host;
            proxy_set_header X-Servicio-Via gateway;
        }

        location /sugerir {
            proxy_pass http://recomendar;
            proxy_set_header Host $host;
            proxy_set_header X-Servicio-Via gateway;
        }

        location = /salud/pedidos {
            proxy_pass http://pedidos/salud;
        }

        location = /salud/recomendar {
            proxy_pass http://recomendar/salud;
        }

        location = /modelos {
            proxy_pass http://recomendar/modelos;
        }
    }
}
