worker_processes 1;

events {
    worker_connections 64;
}

http {
    upstream pedidos {
        server pedidos:8001;
    }

    upstream recomendar {
        server recomendar:8002;
    }

    server {
        listen 80;

        location = / {
            default_type text/plain;
            return 200 "Gateway de microservicios-entregas\n\nPOST /pedidos   -> servicio pedidos\nPOST /sugerir  -> servicio recomendar (solo para depurar)\nGET  /salud/pedidos\nGET  /salud/recomendar\n";
        }

        location /pedidos {
            proxy_pass http://pedidos;
            proxy_set_header Host $host;
            proxy_set_header X-Servicio-Via gateway;
        }

        location /sugerir {
            proxy_pass http://recomendar;
            proxy_set_header Host $host;
            proxy_set_header X-Servicio-Via gateway;
        }

        location = /salud/pedidos {
            proxy_pass http://pedidos/salud;
        }

        location = /salud/recomendar {
            proxy_pass http://recomendar/salud;
        }
    }
}
